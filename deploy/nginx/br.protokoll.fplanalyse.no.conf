# Nginx vhost for Båtlogg — følger FikenTjeneste-malen (second-app).
# Proxy til app-containeren på 127.0.0.1:3001 (samme port som i docker-compose.prod.yml).
# `certbot --nginx -d br.protokoll.fplanalyse.no` legger til 443-blokken + HTTP→HTTPS-redirect.

server {
    listen 80;
    listen [::]:80;
    server_name br.protokoll.fplanalyse.no;

    # HSTS — Certbot flytter denne til 443-blokken (ellers legg den til der manuelt).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3001;   # samme port som i compose-malen
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
